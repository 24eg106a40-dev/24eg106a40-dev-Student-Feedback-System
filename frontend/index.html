<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Feedback System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">
            <h1>Student Feedback</h1>
            <p>Share your valuable feedback about faculty and subjects</p>
        </div>

        <form id="feedbackForm">

            <label for="studentId">Student ID</label>
            <input
                type="number"
                id="studentId"
                value="1"
                required
            >

            <label for="facultyName">Faculty Name</label>
            <input
                type="text"
                id="facultyName"
                placeholder="Enter faculty name"
                required
            >

            <label for="subjectName">Subject Name</label>
            <input
                type="text"
                id="subjectName"
                placeholder="Enter subject name"
                required
            >

            <label for="rating">Rating</label>
            <select id="rating" required>
                <option value="">Select Rating</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Very Good</option>
                <option value="3">3 - Good</option>
                <option value="2">2 - Average</option>
                <option value="1">1 - Poor</option>
            </select>

            <label for="comments">Comments</label>
            <textarea
                id="comments"
                placeholder="Write your feedback here..."
                required
            ></textarea>

            <button type="submit">
                Submit Feedback
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
