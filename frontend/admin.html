
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Student Feedback System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
            background: linear-gradient(135deg, #f97316, #ea580c);
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #ea580c;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 13px 30px;
            border: none;
            border-radius: 8px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c2410c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #feedbackArea {
            margin-top: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 650px;
        }

        th {
            background: #ea580c;
            color: white;
            padding: 12px;
        }

        td {
            border: 1px solid #e2e8f0;
            padding: 11px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        tr:nth-child(even) {
            background: #fff7ed;
        }

        tr:hover {
            background: #fef3c7;
        }

        .rating {
            font-weight: bold;
            color: #ca8a04;
        }

        .success {
            color: #16a34a;
            text-align: center;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
            text-align: center;
            font-weight: bold;
        }

        .info {
            text-align: center;
            color: #475569;
        }

        .count {
            color: #9a3412;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <p>Student Feedback Management System</p>
        </div>

        <button id="loadButton" onclick="loadFeedback()">
            Load Feedback
        </button>

        <div id="feedbackArea" aria-live="polite">
            <p class="info">Click "Load Feedback" to view submitted feedback.</p>
        </div>
    </div>

    <script>
        const API_URL =
            "https://student-feedback-backend-jm7x.onrender.com/api/feedback";

        async function loadFeedback() {
            const area = document.getElementById("feedbackArea");
            const button = document.getElementById("loadButton");

            area.innerHTML = '<p class="info">Loading feedback...</p>';
            button.disabled = true;

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("Unexpected feedback data format.");
                }

                if (data.length === 0) {
                    area.innerHTML = `
                        <h2>Submitted Feedback</h2>
                        <p class="info">No feedback records found.</p>
                        <p class="success">✓ Connection successful</p>
                    `;
                    return;
                }

                const table = document.createElement("table");
                const thead = document.createElement("thead");
                const headerRow = document.createElement("tr");

                ["ID", "Student ID", "Faculty", "Subject", "Rating", "Comments"]
                    .forEach(title => {
                        const th = document.createElement("th");
                        th.textContent = title;
                        headerRow.appendChild(th);
                    });

                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement("tbody");

                data.forEach(feedback => {
                    const row = document.createElement("tr");

                    [
                        feedback.id,
                        feedback.studentId,
                        feedback.facultyName,
                        feedback.subjectName
                    ].forEach(value => {
                        const td = document.createElement("td");
                        td.textContent = value ?? "";
                        row.appendChild(td);
                    });

                    const ratingCell = document.createElement("td");
                    ratingCell.className = "rating";
                    ratingCell.textContent = `⭐ ${feedback.rating ?? ""}/5`;
                    row.appendChild(ratingCell);

                    const commentsCell = document.createElement("td");
                    commentsCell.textContent = feedback.comments ?? "";
                    row.appendChild(commentsCell);

                    tbody.appendChild(row);
                });

                table.appendChild(tbody);

                area.replaceChildren();

                const heading = document.createElement("h2");
                heading.textContent = "Submitted Feedback";

                const count = document.createElement("p");
                count.className = "count";
                count.textContent = `Total feedback records: ${data.length}`;

                const message = document.createElement("p");
                message.className = "success";
                message.textContent = "✓ Feedback loaded successfully";

                area.append(heading, count, table, message);

            } catch (error) {
                console.error("Error loading feedback:", error);

                area.innerHTML = `
                    <p class="error">
                        ❌ Could not load feedback. Please try again.
                    </p>
                    <p class="info">
                        Check your internet connection and backend availability.
                    </p>
                `;
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
